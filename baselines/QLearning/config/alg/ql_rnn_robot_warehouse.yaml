# IQL/VDN/QMix with RNN on Jumanji RobotWarehouse (requires: pip install jumanji)
"TOTAL_TIMESTEPS": 2e6
"NUM_ENVS": 8
"NUM_STEPS": 500
"BUFFER_SIZE": 10000
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 256
"MIXER_EMBEDDING_DIM": 32
"MIXER_HYPERNET_HIDDEN_DIM": 128
"MIXER_INIT_SCALE": 0.001
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.1
"MAX_GRAD_NORM": 25
"TARGET_UPDATE_INTERVAL": 200
"TAU": 1.
"NUM_EPOCHS": 1
"LR": 0.005
"LEARNING_STARTS": 10000
"LR_LINEAR_DECAY": True
"GAMMA": 0.9

# ENV: Jumanji RobotWarehouse-v0 (4 agents, 5 actions: noop, forward, turn_left, turn_right, toggle_load)
"ENV_NAME": "RobotWarehouse-v0"
"ENV_KWARGS":
  sensor_range: 10

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05
"TEST_NUM_STEPS": 500
"TEST_NUM_ENVS": 512

"LOG_AGENTS_SEPARATELY": False
